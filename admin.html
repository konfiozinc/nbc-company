<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D0D0D">
<title>Panel · NBC Company</title>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<!-- Alpine.js -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<style>
:root{
  --accent:#B38728; --accent2:#BF953F; --bg:#F4F6F8; --card:#FFFFFF;
  --txt:#1A202C; --muted:#6B7280; --line:#E2E8F0; --ok:#16A34A; --warn:#D97706;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;-webkit-font-smoothing:antialiased}
[x-cloak]{display:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}

/* ===== LOGIN ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:30px 24px;box-shadow:0 20px 50px rgba(0,0,0,.10)}
.login-logo{width:72px;height:72px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;margin:0 auto 16px}
.login-card h1{text-align:center;font-size:1.3rem;margin-bottom:4px}
.login-card .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;font-weight:700;font-size:.95rem;padding:13px 18px;transition:.18s}
.btn-block{width:100%}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed}
.btn-ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.btn-ghost:hover{background:#fdf6e8}
.error-msg{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;border-radius:10px;padding:10px 12px;font-size:.85rem;margin-bottom:14px}

/* ===== DASHBOARD ===== */
.app-head{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.app-head .t{font-weight:900;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.app-head .t .dot{width:9px;height:9px;border-radius:50%;background:#3DDC84;box-shadow:0 0 0 3px rgba(61,220,132,.3)}
.app-head button{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:10px;padding:8px 12px;font-size:.8rem;font-weight:700}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.search{position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:.8rem;font-weight:600;color:var(--muted)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.count{font-size:.8rem;color:var(--muted);margin-bottom:10px}

/* ===== LISTA ===== */
.list{display:flex;flex-direction:column;gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center}
.pimg{width:64px;height:64px;border-radius:12px;background:#EDF2F7 center/cover no-repeat;flex:0 0 64px}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pname .star{color:var(--warn)}
.pcat{font-size:.75rem;color:var(--muted)}
.pmeta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.price{font-weight:800;color:var(--accent);font-size:1.05rem}
.badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px}
.badge.oculto{background:#F1F5F9;color:#64748B}
.badge.agotado{background:#FEF2F2;color:#DC2626}
.pactions{display:flex;flex-direction:column;gap:6px}
.pactions button{border:1px solid var(--line);background:#fff;border-radius:9px;width:36px;height:36px;display:grid;place-items:center;font-size:15px}
.pactions .del{color:#DC2626}
.pactions .del:hover{background:#FEF2F2}
.pactions .star-btn{color:#B45309}
.pactions .star-btn.on{background:#FFFBEB;border-color:#FCD34D}
.pactions .eye{color:#0F766E}
.pactions .eye.off{color:#9CA3AF;opacity:.6}
.empty{text-align:center;color:var(--muted);padding:40px 20px;background:var(--card);border-radius:16px;border:1px dashed var(--line)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:28px;box-shadow:0 10px 24px rgba(0,0,0,.25);display:grid;place-items:center}

/* ===== MODAL ===== */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.55);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.overlay{align-items:center;padding:20px}}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px 28px}
@media(min-width:640px){.sheet{border-radius:20px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-head h2{font-size:1.15rem}
.sheet-head button{border:none;background:#F1F5F9;border-radius:50%;width:34px;height:34px;font-size:16px;color:var(--muted)}
.img-picker{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.img-preview{width:72px;height:72px;border-radius:12px;background:#EDF2F7 center/cover no-repeat;flex:0 0 72px;border:1px dashed var(--line)}
.img-picker .info{font-size:.75rem;color:var(--muted)}
.caract-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.caract-chip{display:inline-flex;align-items:center;gap:6px;background:#F8FAFC;border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:.8rem;font-weight:600}
.caract-chip button{border:none;background:transparent;color:#DC2626;font-size:14px;line-height:1;cursor:pointer;padding:0}
.caract-add{display:flex;gap:6px}
.caract-add input{flex:1;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px}
.caract-add button{flex:0 0 auto;padding:10px 14px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:700}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 2px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#F8FAFC;border:1px solid var(--line);border-radius:12px;padding:12px}
.toggle .lbl{font-size:.85rem;font-weight:700}
.switch{position:relative;width:44px;height:24px;flex:0 0 44px}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;background:#CBD5E1;border-radius:99px;transition:.2s}
.switch .slider::before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--accent)}
.switch input:checked + .slider::before{transform:translateX(20px)}
.sheet-foot{display:flex;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#111827;color:#fff;padding:11px 18px;border-radius:12px;font-size:.85rem;font-weight:600;z-index:80;transition:.3s;box-shadow:0 10px 30px rgba(0,0,0,.3);pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.loading{text-align:center;color:var(--muted);padding:30px;font-size:.9rem}
</style>
</head>
<body x-data="admin" x-cloak>

<!-- ===== CARGANDO ===== -->
<div x-show="!authReady">
  <div class="login-wrap"><div class="loading">Cargando…</div></div>
</div>

<!-- ===== LOGIN ===== -->
<div x-show="authReady && !usuario">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">🥘</div>
      <h1 x-text="cfg.nombre + ' — Panel'"></h1>
      <p class="sub">Ingresa con tu correo y contraseña</p>
      <div class="error-msg" x-show="loginError" x-text="loginError"></div>
      <div class="field">
        <label>Correo</label>
        <input type="email" x-model="email" placeholder="admin@ejemplo.com" autocomplete="username">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" x-model="password" placeholder="••••••••" autocomplete="current-password" @keydown.enter="login">
      </div>
      <button class="btn btn-primary btn-block" @click="login" :disabled="loginLoading" x-text="loginLoading ? 'Entrando…' : 'Entrar'"></button>
    </div>
  </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div x-show="authReady && usuario">
  <header class="app-head" :style="'background:'+cfg.color">
    <div class="t"><span class="dot"></span><span x-text="cfg.nombre"></span></div>
    <button @click="logout">Salir</button>
  </header>
  <div class="wrap">
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" x-model="busqueda" placeholder="Buscar producto…">
      </div>
      <div class="chips">
        <button class="chip" :class="filtro==='' && 'active'" @click="filtro=''">Todos</button>
        <template x-for="c in cfg.categorias" :key="c">
          <button class="chip" :class="filtro===c && 'active'" @click="filtro = (filtro===c ? '' : c)" x-text="c"></button>
        </template>
      </div>
    </div>
    <div class="count" x-text="'Mostrando '+filtrados.length+' de '+productos.length+' productos'"></div>

    <div class="loading" x-show="cargando">Cargando productos…</div>

    <div class="list" x-show="!cargando">
      <template x-for="p in filtrados" :key="p.id">
        <div class="pcard" :style="p.agotado ? 'opacity:.6' : ''">
          <div class="pimg" :style="p.imagen ? 'background-image:url('+p.imagen+')' : ''"></div>
          <div class="pinfo">
            <div class="pname"><span x-text="p.nombre"></span><span class="star" x-show="p.destacado" title="Destacado">★</span></div>
            <div class="pcat" x-text="p.categoria"></div>
            <div class="pmeta">
              <span class="price" x-show="p.precioVisible && p.precio > 0" x-text="fmtPrecio(p.precio)"></span>
              <span class="badge oculto" x-show="!(p.precioVisible && p.precio > 0)">Precio oculto</span>
              <span class="badge agotado" x-show="p.agotado">Agotado</span>
            </div>
          </div>
          <div class="pactions">
            <button class="star-btn" :class="p.destacado && 'on'" @click="toggleDestacado(p)" :title="p.destacado ? 'Quitar destacado' : 'Marcar destacado'">★</button>
            <button class="eye" :class="p.agotado ? 'off' : ''" @click="toggleAgotado(p)" :title="p.agotado ? 'Marcar disponible' : 'Marcar agotado'">👁</button>
            <button @click="editar(p)" title="Editar">✎</button>
            <button class="del" @click="eliminar(p)" title="Eliminar">🗑</button>
          </div>
        </div>
      </template>
      <div class="empty" x-show="!filtrados.length && !cargando">No hay productos con ese criterio.</div>
    </div>
  </div>
  <button class="fab" @click="nuevo()" title="Nuevo producto">+</button>
</div>

<!-- ===== MODAL PRODUCTO ===== -->
<div class="overlay" x-show="modal" @click.self="cerrarModal()">
  <div class="sheet">
    <div class="sheet-head">
      <h2 x-text="editandoId ? 'Editar producto' : 'Nuevo producto'"></h2>
      <button @click="cerrarModal()">✕</button>
    </div>

    <div class="img-picker">
      <div class="img-preview" :style="form.imagen ? 'background-image:url('+form.imagen+')' : ''"></div>
      <div class="info">
        <input type="file" accept="image/*" @change="subirImagen($event)">
        <div style="margin-top:4px">JPG/PNG/WebP · máx 5 MB<br>Se comprime automáticamente</div>
        <div x-show="subiendo" style="color:#1D4ED8;margin-top:4px">Subiendo imagen…</div>
      </div>
    </div>

    <div class="field"><label>Nombre</label><input type="text" x-model="form.nombre" placeholder="Ej: Olla Royal Prestige 5L"></div>
    <div class="field"><label>Categoría</label>
      <select x-model="form.categoria">
        <template x-for="c in cfg.categorias" :key="c"><option :value="c" x-text="c"></option></template>
      </select>
    </div>
    <div class="field"><label>Descripción corta</label><input type="text" x-model="form.descripcionCorta" placeholder="Resumen de una línea"></div>
    <div class="field"><label>Descripción larga</label><textarea x-model="form.descripcionLarga" rows="3" placeholder="Descripción completa del producto"></textarea></div>

    <div class="field">
      <label>Características</label>
      <div class="caract-list">
        <template x-for="(c, i) in form.caracteristicas" :key="i">
          <span class="caract-chip"><span x-text="c"></span><button @click="quitarCaract(i)" title="Quitar">✕</button></span>
        </template>
      </div>
      <div class="caract-add">
        <input type="text" x-model="nuevaCaract" placeholder="Ej: Acero 316L" @keydown.enter="agregarCaract()">
        <button @click="agregarCaract()">+ Añadir</button>
      </div>
    </div>

    <div class="field"><label>Precio (COP)</label><input type="number" x-model="form.precio" min="0" step="100" placeholder="0"></div>
    <div class="field"><label>Orden</label><input type="number" x-model="form.orden" min="1" step="1" placeholder="1"></div>

    <div class="toggles">
      <label class="toggle"><span class="lbl">⭐ Destacado</span><span class="switch"><input type="checkbox" x-model="form.destacado"><span class="slider"></span></span></label>
      <label class="toggle"><span class="lbl">✅ Disponible</span><span class="switch"><input type="checkbox" x-model="form.disponible"><span class="slider"></span></span></label>
      <label class="toggle"><span class="lbl">💰 Mostrar precio</span><span class="switch"><input type="checkbox" x-model="form.precioVisible"><span class="slider"></span></span></label>
    </div>

    <div class="sheet-foot">
      <button class="btn btn-ghost btn-block" @click="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary btn-block" @click="guardar()" :disabled="guardando" x-text="guardando ? 'Guardando…' : 'Guardar'"></button>
    </div>
  </div>
</div>

<div class="toast" :class="toast && 'show'" x-text="toast"></div>

<script src="admin-config.js"></script>
<script>
let firebaseAuth = null;
let firebaseDB = null;

function initFirebase(){
  if (firebase.apps.length === 0) firebase.initializeApp(window.ADMIN_CONFIG.firebase);
  firebaseAuth = firebase.auth();
  firebaseDB = firebase.database();
}

function admin(){
  return {
    cfg: window.ADMIN_CONFIG,
    usuario: null, authReady: false,
    email: '', password: '', loginError: '', loginLoading: false,
    productos: [], busqueda: '', filtro: '', cargando: true,
    modal: false, editandoId: null, guardando: false, subiendo: false,
    toast: '', nuevaCaract: '',
    form: { nombre:'', categoria:'', descripcionCorta:'', descripcionLarga:'', caracteristicas:[], precio:0, precioVisible:false, imagen:'', orden:1, destacado:false, disponible:true },

    init(){
      initFirebase();
      this.email = this.cfg.email || '';
      firebaseAuth.onAuthStateChanged(u => {
        this.usuario = u;
        this.authReady = true;
        if (u) this.escuchar();
      });
    },

    escuchar(){
      firebaseDB.ref(this.cfg.ruta + '/productos').on('value', snap => {
        const data = snap.val() || {};
        const lista = Object.keys(data).filter(k => data[k]).map(k => ({ id: k, ...data[k] }));
        this.productos = JSON.parse(JSON.stringify(lista));
        this.cargando = false;
      }, err => { this.cargando = false; this.toastMsg('Error al cargar: ' + err.message); });
    },

    get filtrados(){
      const q = this.busqueda.trim().toLowerCase();
      return this.productos.filter(p => {
        const okCat = !this.filtro || p.categoria === this.filtro;
        const okQ = !q || (p.nombre||'').toLowerCase().includes(q) || (p.descripcionCorta||'').toLowerCase().includes(q) || (p.descripcionLarga||'').toLowerCase().includes(q);
        return okCat && okQ;
      });
    },

    fmtPrecio(v){ return v ? '$' + Number(v).toLocaleString('es-CO') : '—'; },

    login(){
      this.loginError = '';
      if (!this.email.trim() || !this.password) { this.loginError = 'Ingresa correo y contraseña.'; return; }
      this.loginLoading = true;
      firebaseAuth.signInWithEmailAndPassword(this.email.trim(), this.password)
        .then(() => { this.password = ''; })
        .catch(e => { this.loginError = 'No se pudo entrar: ' + (e.code === 'auth/invalid-credential' ? 'correo o contraseña incorrectos' : e.message); })
        .finally(() => this.loginLoading = false);
    },

    logout(){ firebaseAuth.signOut(); this.productos = []; },

    nuevo(){
      this.editandoId = null;
      this.form = { nombre:'', categoria:this.cfg.categorias[0], descripcionCorta:'', descripcionLarga:'', caracteristicas:[], precio:0, precioVisible:false, imagen:'', orden:(this.productos.length + 1), destacado:false, disponible:true };
      this.nuevaCaract = '';
      this.modal = true;
    },
    editar(p){
      this.editandoId = p.id;
      this.form = {
        nombre: p.nombre || '', categoria: p.categoria || this.cfg.categorias[0],
        descripcionCorta: p.descripcionCorta || '', descripcionLarga: p.descripcionLarga || '',
        caracteristicas: Array.isArray(p.caracteristicas) ? p.caracteristicas.slice() : [],
        precio: Number(p.precio) || 0, precioVisible: !!p.precioVisible,
        imagen: p.imagen || '', orden: Number(p.orden) || 1,
        destacado: !!p.destacado, disponible: !p.agotado
      };
      this.nuevaCaract = '';
      this.modal = true;
    },
    cerrarModal(){ this.modal = false; this.subiendo = false; },

    agregarCaract(){
      const v = (this.nuevaCaract || '').trim();
      if (v && !this.form.caracteristicas.includes(v)) this.form.caracteristicas.push(v);
      this.nuevaCaract = '';
    },
    quitarCaract(i){ this.form.caracteristicas.splice(i, 1); },

    guardar(){
      if (!this.form.nombre.trim()) { this.toastMsg('El nombre es obligatorio'); return; }
      this.guardando = true;
      const datos = {
        nombre: this.form.nombre.trim(),
        categoria: this.form.categoria,
        descripcionCorta: this.form.descripcionCorta.trim(),
        descripcionLarga: this.form.descripcionLarga.trim(),
        caracteristicas: this.form.caracteristicas,
        precio: Number(this.form.precio) || 0,
        precioVisible: !!this.form.precioVisible,
        imagen: this.form.imagen,
        orden: Number(this.form.orden) || 1,
        destacado: !!this.form.destacado,
        agotado: !this.form.disponible
      };
      const ref = firebaseDB.ref(this.cfg.ruta + '/productos');
      const op = this.editandoId ? ref.child(this.editandoId).update(datos) : ref.push(datos);
      op.then(() => { this.modal = false; this.toastMsg('✓ Producto guardado'); })
        .catch(e => this.toastMsg('Error: ' + e.message))
        .finally(() => this.guardando = false);
    },

    eliminar(p){
      if (!confirm('¿Eliminar "' + p.nombre + '"? Esta acción no se puede deshacer.')) return;
      firebaseDB.ref(this.cfg.ruta + '/productos/' + p.id).remove()
        .then(() => this.toastMsg('🗑 Producto eliminado'))
        .catch(e => this.toastMsg('Error: ' + e.message));
    },

    toggleAgotado(p){
      firebaseDB.ref(this.cfg.ruta + '/productos/' + p.id).update({ agotado: !p.agotado })
        .catch(e => this.toastMsg('Error: ' + e.message));
    },
    toggleDestacado(p){
      firebaseDB.ref(this.cfg.ruta + '/productos/' + p.id).update({ destacado: !p.destacado })
        .catch(e => this.toastMsg('Error: ' + e.message));
    },

    subirImagen(ev){
      const file = ev.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { this.toastMsg('⚠️ Selecciona una imagen válida'); return; }
      if (file.size > 5*1024*1024) { this.toastMsg('⚠️ Imagen muy grande (máx 5 MB)'); return; }
      if (!this.cfg.cloudinary || !this.cfg.cloudinary.cloudName || !this.cfg.cloudinary.uploadPreset) {
        this.toastMsg('⚠️ Cloudinary aún no está configurado'); return;
      }
      this.subiendo = true;
      this.comprimir(file, 800, 0.8).then(blob => {
        const formData = new FormData();
        formData.append('file', blob, 'producto.jpg');
        formData.append('upload_preset', this.cfg.cloudinary.uploadPreset);
        return fetch('https://api.cloudinary.com/v1_1/' + this.cfg.cloudinary.cloudName + '/image/upload', {
          method: 'POST', body: formData
        }).then(r => r.json()).then(data => {
          if (!data.secure_url) throw new Error((data.error && data.error.message) ? data.error.message : 'No se pudo subir');
          return data.secure_url;
        });
      }).then(url => { this.form.imagen = url; this.subiendo = false; this.toastMsg('✓ Imagen lista'); })
        .catch(e => { this.subiendo = false; this.toastMsg('Error al subir: ' + e.message); });
    },

    comprimir(file, maxW, quality){
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const scale = Math.min(1, maxW / img.width);
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          canvas.toBlob(b => b ? resolve(b) : reject(new Error('No se pudo procesar')), 'image/jpeg', quality);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Imagen inválida')); };
        img.src = url;
      });
    },

    toastMsg(m){
      this.toast = m;
      clearTimeout(this._t);
      this._t = setTimeout(() => this.toast = '', 2600);
    }
  };
}
</script>
